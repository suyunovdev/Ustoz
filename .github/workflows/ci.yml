name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        # package-lock.json gitignore'da → npm ci EMAS. .npmrc'da omit=optional bo'lgani uchun
        # rollup/swc native (Linux) binary'lari uchun --include=optional kerak.
        run: npm install --legacy-peer-deps --include=optional

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        # package-lock.json gitignore'da → npm ci EMAS. .npmrc'da omit=optional bo'lgani uchun
        # rollup/swc native (Linux) binary'lari uchun --include=optional kerak.
        run: npm install --legacy-peer-deps --include=optional

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm run test:run

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]

    env:
      DATABASE_URL: "postgresql://fake:fake@localhost:5432/fake"
      JWT_SECRET: "ci-test-secret-at-least-32-chars-long"
      NEXT_PUBLIC_APP_URL: "http://localhost:4028"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        # package-lock.json gitignore'da → npm ci EMAS. .npmrc'da omit=optional bo'lgani uchun
        # rollup/swc native (Linux) binary'lari uchun --include=optional kerak.
        run: npm install --legacy-peer-deps --include=optional

      - name: Build
        run: npm run build

  # CD — faqat main'ga push'da va lint/test/build o'tgach production VPS'ga deploy.
  # SSH orqali serverdagi blue-green skript ishga tushadi (clone → build → atomik swap → pm2 reload).
  deploy:
    name: Deploy (production)
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # Bir vaqtda faqat bitta deploy — ustma-ust deploy'lar navbatga tushadi, bekor qilinmaydi.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: VPS'ga SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          script: bash /home/deploy/deploy-ustoz.sh main
