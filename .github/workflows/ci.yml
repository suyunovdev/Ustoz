name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # package-lock.json commit qilingan → deterministik va yengilroq npm ci.
        # .npmrc'da omit=optional; native (Linux) binary'lar uchun --include=optional kerak.
        run: npm ci --include=optional

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # package-lock.json commit qilingan → deterministik va yengilroq npm ci.
        # .npmrc'da omit=optional; native (Linux) binary'lar uchun --include=optional kerak.
        run: npm ci --include=optional

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm run test:run

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]

    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      DATABASE_URL: "postgresql://fake:fake@localhost:5432/fake"
      JWT_SECRET: "ci-test-secret-at-least-32-chars-long"
      # NEXT_PUBLIC_* build vaqtida baked bo'ladi — production public domen bo'lishi
      # shart (appUrl()/OAuth redirect'lari shundan quriladi). localhost EMAS.
      NEXT_PUBLIC_APP_URL: "https://ustozedu.uz"
      NEXT_PUBLIC_SITE_URL: "https://ustozedu.uz"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # package-lock.json commit qilingan → deterministik va yengilroq npm ci.
        # .npmrc'da omit=optional; native (Linux) binary'lar uchun --include=optional kerak.
        run: npm ci --include=optional

      - name: Build
        run: npm run build

      # ARTIFACT modeli: build shu yerda (Actions runner, RAM yetarli) qilinadi,
      # standalone bundle yig'ilib artifact sifatida yuklanadi. VPS'da build YO'Q → OOM imkonsiz.
      - name: Standalone bundle yig'ish
        # deploy-bundle/ = standalone ROOT (server.js top-level) + static + public + prisma.
        # VPS'da bu to'g'ridan-to'g'ri /var/www/ustoz'ga ochiladi (server.js /var/www/ustoz/server.js).
        run: |
          set -e
          rm -rf deploy-bundle && mkdir -p deploy-bundle/.next
          cp -r .next/standalone/. deploy-bundle/
          cp -r .next/static deploy-bundle/.next/static
          [ -d public ] && cp -r public deploy-bundle/public
          cp -r prisma deploy-bundle/prisma
          tar czf deploy-bundle.tar.gz -C deploy-bundle .
          ls -lh deploy-bundle.tar.gz

      - name: Artifact yuklash
        uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle
          path: deploy-bundle.tar.gz
          retention-days: 3

  # CD — faqat main'ga push'da va lint/test/build o'tgach production VPS'ga deploy.
  # CI'da qurilgan standalone artifact SCP bilan VPS'ga tashlanadi, VPS faqat
  # extract + atomik swap + pm2 reload qiladi (deploy-ustoz-artifact.sh). VPS'da build YO'Q.
  deploy:
    name: Deploy (production)
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # Bir vaqtda faqat bitta deploy — ustma-ust deploy'lar navbatga tushadi, bekor qilinmaydi.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Artifact yuklab olish
        uses: actions/download-artifact@v4
        with:
          name: deploy-bundle

      - name: SCP artifact -> VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy-bundle.tar.gz
          target: /home/deploy/incoming

      - name: Extract + atomik swap + pm2 reload
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: bash /home/deploy/deploy-ustoz-artifact.sh

      - name: Health check (deploy'dan keyin)
        run: |
          # Yangi deploy jonli javob berayotganini tekshiramiz. Muvaffaqiyatsiz bo'lsa
          # workflow QIZIL bo'ladi — buzilgan deploy "yashil" ko'rinmaydi.
          URL="${{ secrets.HEALTH_URL || 'https://ustozedu.uz/api/health' }}"
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo 000)
            if [ "$code" = "200" ]; then echo "Sog'lom (urinish $i)"; exit 0; fi
            echo "urinish $i: HTTP $code — kutilyapti..."; sleep 6
          done
          echo "::error::Health check muvaffaqiyatsiz — deploy tekshirilishi kerak"
          exit 1
