# CI'DA BUILD, VPS'ga faqat standalone artifact ship qilinadi → VPS'da build YO'Q → OOM imkonsiz.
#
# Nega: VPS (Contabo 7.8G) allaqachon Elasticsearch(2G)+Docker+Grafana+6 boshqa Next-app
# bilan to'la. Deploy'da `next build`ning "Collecting build traces" burst'i xotirani
# tugatib OOM (.nft.json ENOENT) beradi. Build'ni Actions runnerga ko'chirsak — muammo
# strukturaviy yo'qoladi. next.config.mjs'da `output: 'standalone'` bor.
#
# Hozircha QO'LDA ishga tushiriladi (workflow_dispatch) — mavjud ci.yml auto-deploy'ni
# buzmasdan sinash uchun. Yashil bo'lgach ci.yml deploy job'i shunga o'tkaziladi.

name: Deploy Standalone (manual)

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build + Ship + Reload
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      # Build vaqtida kerak bo'ladigan "fake" qiymatlar (Prisma generate / next build
      # DATABASE_URL/JWT_SECRET talab qiladi; runtime .env VPS'da alohida).
      DATABASE_URL: "postgresql://fake:fake@localhost:5432/fake"
      JWT_SECRET: "ci-build-secret-at-least-32-chars-long"
      # KRITIK: NEXT_PUBLIC_* build vaqtida baked bo'ladi → PRODUCTION domen bo'lishi shart
      # (appUrl()/OAuth redirect'lari shundan quriladi). localhost EMAS. ci.yml build job bilan bir xil.
      NEXT_PUBLIC_APP_URL: "https://ustozedu.uz"
      NEXT_PUBLIC_SITE_URL: "https://ustozedu.uz"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build (standalone)
        run: npm run build

      - name: Standalone bundle yig'ish
        # deploy-bundle/ = standalone ROOT (server.js top-level'da) + static + public + prisma.
        # VPS'da bu to'g'ridan-to'g'ri /var/www/ustoz'ga ochiladi → server.js /var/www/ustoz/server.js.
        run: |
          set -e
          rm -rf deploy-bundle && mkdir -p deploy-bundle/.next
          cp -r .next/standalone/. deploy-bundle/
          cp -r .next/static deploy-bundle/.next/static
          [ -d public ] && cp -r public deploy-bundle/public
          cp -r prisma deploy-bundle/prisma
          tar czf deploy-bundle.tar.gz -C deploy-bundle .
          ls -lh deploy-bundle.tar.gz

      - name: SCP artifact -> VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy-bundle.tar.gz
          target: /home/deploy/incoming

      - name: Extract + atomic swap + pm2 reload
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          # VPS-side skript: live .env'ni saqlaydi, atomik mv swap qiladi, pm2 reload.
          # Mavjud /var/www/ustoz + /home/deploy/_provisioner/ustoz.config.cjs qayta ishlatiladi.
          script: bash /home/deploy/deploy-ustoz-artifact.sh

      - name: Health check (deploy'dan keyin)
        run: |
          URL="${{ secrets.HEALTH_URL || 'https://ustozedu.uz/api/health' }}"
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo 000)
            if [ "$code" = "200" ]; then echo "Sog'lom (urinish $i)"; exit 0; fi
            echo "urinish $i: HTTP $code — kutilyapti..."; sleep 6
          done
          echo "::error::Health check muvaffaqiyatsiz — deploy tekshirilishi kerak"
          exit 1
